name: Push config files to gcp buckets

on:
  push:
    branches: [main, master]
    paths:
      - 'mkdocs.yaml' 
      - 'catalog-info.yaml' 
      - '.github/**'

jobs:
  Upload-to-GCP:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install dependancy
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml
      - name: read-entity-name
        run: |
          NAME=$(python -c "import yaml; print(yaml.safe_load(open('catalog-info.yaml', 'r'))['metadata']['name'].lower())")
          echo "ENTITY_NAME=$NAME" >> $GITHUB_ENV
      - name: Authenticate to gcp 
        uses: google-github-actions/auth@v2
        with: 
          credentials_json: ${{secrets.GCP_SA_KEY}}
      - name: Upload files natively via gcloud CLI
        run: |
          # Natively copy files directly using the authenticated environment
          gcloud storage cp catalog-info.yaml gs://${{ secrets.GCP_BUCKET_NAME }}/${{ env.ENTITY_NAME }}/catalog-info.yaml
          gcloud storage cp mkdocs.yaml gs://${{ secrets.GCP_BUCKET_NAME }}/${{ env.ENTITY_NAME }}/mkdocs.yaml
      
