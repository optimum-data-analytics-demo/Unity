name: Push config files to gcp buckets

on:
  push:
    branches: [main, master]
    paths:
      - 'mkdocs.yaml' 
      - 'catalog-info.yaml' 

jobs:
  Upload-to-GCP:
    runs-on: ubuntu-latest
    steps:
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install dependancy
        run: |
          python -m pip install --upgrate pip
          python -m pip install pyyaml
      - name: read-entity-name
        run: |
          NAME=$(python -c "import yaml; print(yaml.safe_load(open('catalog-info.yaml','r'))['metadata']['name'].lower()) " )
          echo "ENTITY_NAME=$NAME" >> $GITHUB_ENV
      - name: Authenticate to gcp 
        uses: google-github-actions/auth@v2
        with: 
          credentials_json: ${{secrets.GCP_SA_KEY}}
      - name: Uploads files to GCP
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          paths: |
            catalog-info.yaml
            mkdocs.yaml
          destination: $${{secrets.GCP_BUCKET_NAME}}/${{env.ENTITY_NAME}}
          parent: False
      

