name: Update Techdocs Documents
on:
  push: 
    branches: [main]
    paths: 
      - 'docs/**'
      - 'mkdocs.yaml'
      - 'catalog-info.yaml'
      - '.github/**'
      

jobs:
  build-mkdocs:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout Repository
        uses: actions/checkout@v4
      

      - name: Set up python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.11"

      - name: Install Dependancies
        run: |
          python -m pip install --upgrade pip 
          python -m pip install mkdocs-techdocs-core pyyaml

      - name: build static side
        run: mkdocs build 

      - name: read entity name 
        run: |
          NAME=$(python -c "import yaml; print(yaml.safe_load(open('catalog-info.yaml'))['metadata']['name'].lower())")
          echo "Entity name: $NAME"
          echo "ENTITY_NAME=$NAME" >> $GITHUB_ENV      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{secrets.GCP_SA_KEY}}
      
      - name: Upload to GCP
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: site/
          destination: ${{secrets.GCP_BUCKET_NAME}}/default/component/${{env.ENTITY_NAME}}
          parent: false
