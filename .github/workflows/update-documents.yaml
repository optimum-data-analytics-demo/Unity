name: Update Techdocs Documents

on:
  push: 
    branches: [main]
      paths: 
        - 'docs/**'
        - 'mkdocs.yaml'
        - 'catalog-info.yaml'
      

jobs:
  build-mkdocs:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout Repository
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0

      - name: Set up python
        uses: actions/setup-python@v5
        with: 
          python-version:"3.x"

      - name: Install Dependancies
        run: |
          python -m pip install --upgrade pip 
          pip install mkdocs 

      - name: build static side
        run: mkdocs build 

      - name: read entity name 
        run: echo "ENTITY_NAME=$(python -c "import yaml;print(yaml.safe_load(open('catalog-info.yaml','r'))['metadata']['name'].lower()")">>$GITHUB_ENV
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@2
        with:
          credentials_json: ${{secrets.GCP_SA_KEY}}
      
      - name: Upload to GCP
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: site/
          destination: ${{secrets.GCP_BUCKET_NAME}}/default/component/${{env.ENTITy_NAME}}
          parent: false


